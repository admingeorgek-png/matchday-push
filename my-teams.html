<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>My Teams · MATCHDAY</title><style>body{margin:0;background:#06101d;color:#eef5ff;font:15px system-ui}main{max-width:900px;margin:auto;padding:25px 18px}.top{background:#07111f;padding:15px 18px;border-bottom:1px solid #22344a}.brand{font-size:22px;font-weight:900}.brand i{color:#ff3030;font-style:normal}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer}.back{background:#17283c;color:#fff}.card{background:#0d1a29;border:1px solid #24374e;border-radius:13px;padding:18px;margin-top:15px}.team{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #1d2d40;padding:13px 0}.remove{background:#7d2630;color:#fff}.muted{color:#91a4bb}input{background:#101d2c;border:1px solid #2c4058;color:#fff;border-radius:9px;padding:11px;width:100%;margin:12px 0}.results button{display:block;width:100%;text-align:left;background:#132337;color:#fff;border:1px solid #263c54;border-radius:8px;padding:12px;margin:6px 0;cursor:pointer}</style></head><body><header class="top"><div class="brand">MATCHDAY <i>PUSH</i> ⚽</div></header><main><button class="btn back" onclick="location.href='/'">← Back to Matchday</button><h1>⭐ My Teams</h1><p class="muted">Add your favorite teams to personalize your Matchday experience.</p><input id="search" placeholder="Search a team…"><div id="results" class="results"></div><div id="list" class="card"></div></main><script>const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let all=[];function get(){return JSON.parse(localStorage.getItem('matchdayTeams')||'[]')}function save(x){localStorage.setItem('matchdayTeams',JSON.stringify(x))}function render(){const a=get();document.querySelector('#list').innerHTML=a.length?a.map((t,i)=>`<div class="team"><span>⚽ ${esc(t.name)}</span><button class="btn remove" onclick="removeT(${i})">Remove</button></div>`).join(''):'<p class="muted">You have not added any teams yet.</p>'}function removeT(i){let a=get();a.splice(i,1);save(a);render()}function add(t){let a=get();if(!a.some(x=>x.id===t.id)){a.push(t);save(a)}render();document.querySelector('#results').innerHTML='';document.querySelector('#search').value=''}document.querySelector('#search').oninput=e=>{const q=e.target.value.toLowerCase();if(!q){document.querySelector('#results').innerHTML='';return}const r=all.filter(t=>t.name.toLowerCase().includes(q)).slice(0,12);document.querySelector('#results').innerHTML=r.map(t=>`<button onclick='add(${JSON.stringify(t)})'>⚽ ${esc(t.name)}</button>`).join('')||'<p class="muted">No teams found in current live data.</p>'};async function init(){try{const d=await(await fetch('/api/data',{cache:'no-store'})).json();const s=new Set();Object.values(d.leagues||{}).forEach(l=>(l.fixtures||[]).forEach(f=>[f.homeTeam,f.awayTeam].forEach(t=>t?.name&&s.add(JSON.stringify({id:t.id||t.name,name:t.name,logo:t.logo||''}))));all=[...s].map(JSON.parse)}catch{}render()}init()</script></body></html>
